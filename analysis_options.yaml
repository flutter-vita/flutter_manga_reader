include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.tailor.dart"
    - "**/*.drift.dart"
    - lib/gen/**.dart
    - lib/design_system/icons/manga_reader_icons.dart
    - build/**
    - android/**
    - ios/**
    - macos/**

formatter:
  trailing_commas: preserve
